spring.config.import=optional:file:.env[.properties]
spring.application.name=twitter

#spring.datasource.url = jdbc:mysql://localhost:3306/twitter
#spring.datasource.username = root
#spring.datasource.password = root

spring.datasource.url=${NEON_DATABASE_CONNECTION_STRING}
twitter.frontend-url=${REACT_WEBSITE_URL}

# TWITTER PHOTOS
twitter.profile-photo=/images/default-profile-photo.jpg
twitter.background-photo=/images/default-background.png

# MAXIMUM FILE SIZE
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# CLOUDINARY CLOUD NAME, API KEY AND API SECRET
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG