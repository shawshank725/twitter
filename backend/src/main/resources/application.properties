spring.config.import=optional:file:.env[.properties]
spring.application.name=twitter

spring.datasource.url = jdbc:mysql://localhost:3306/twitter
spring.datasource.username = root
spring.datasource.password = root

# TWITTER PHOTOS
twitter.profile-photo=https://upload.wikimedia.org/wikipedia/commons/a/ac/Default_pfp.jpg
twitter.background-photo=https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/2011-03-09-fort-du-lomont-10.jpg/800px-2011-03-09-fort-du-lomont-10.jpg

# MAXIMUM FILE SIZE
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# CLOUDINARY CLOUD NAME, API KEY AND API SECRET
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}