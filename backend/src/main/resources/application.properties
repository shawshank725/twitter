spring.config.import=optional:file:.env[.properties]
spring.application.name=twitter

#spring.datasource.url = jdbc:mysql://localhost:3306/twitter
#spring.datasource.username = root
#spring.datasource.password = root

spring.datasource.url=${NEON_DATABASE_CONNECTION_STRING}
twitter.frontend-url=${REACT_WEBSITE_URL}

# TWITTER PHOTOS
twitter.profile-photo=https://upload.wikimedia.org/wikipedia/commons/a/ac/Default_pfp.jpg
twitter.background-photo=https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Sydney_Harbour_Bridge_night.jpg/1920px-Sydney_Harbour_Bridge_night.jpg

# MAXIMUM FILE SIZE
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# CLOUDINARY CLOUD NAME, API KEY AND API SECRET
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC